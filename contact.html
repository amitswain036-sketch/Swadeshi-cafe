<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swadeshi Cafe - Contact</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fdf6ec;
            color: #3e2723;
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: #4e342e;
            color: #ffffff;
            text-align: center;
            padding: 30px 20px 20px;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        nav a {
            color: #f5deb3;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin: 0 6px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 2px solid #d7ccc8;
            margin: 0;
        }

        /* Main content */
        main {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        main h2 {
            font-size: 26px;
            color: #4e342e;
            margin-bottom: 24px;
        }

        /* Booking form */
        form {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #4e342e;
            margin-bottom: 6px;
        }

        form input[type="text"],
        form input[type="tel"],
        form input[type="number"],
        form input[type="date"],
        form input[type="time"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid #d7ccc8;
            border-radius: 8px;
            outline: none;
            margin-bottom: 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        form input:focus {
            border-color: #4e342e;
            box-shadow: 0 0 0 3px rgba(78, 52, 46, 0.12);
        }

        form input[type="submit"],
        form input[type="reset"] {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 6px;
        }

        form input[type="submit"] {
            background-color: #4e342e;
            color: #ffffff;
            margin-right: 10px;
        }

        form input[type="submit"]:hover {
            background-color: #3e2723;
        }

        form input[type="reset"] {
            background-color: #eee2d6;
            color: #4e342e;
        }

        form input[type="reset"]:hover {
            background-color: #e0d2c0;
        }

        /* Footer */
        footer {
            background-color: #4e342e;
            color: #f5deb3;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- Header & Navigation -->
    <header>
        <h1>☕ The Swadeshi Cafe</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="menu.html">Menu</a> |
            <a href="contact.html">Book a Table</a>
        </nav>
    </header>

    <hr>

    <!-- Main Content -->
    <main>
        <h2>Book a Table Online</h2>

        <form>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="9876543210" required><br><br>

            <label for="guests">Number of Guests:</label><br>
            <input type="number" id="guests" name="guests" min="1" max="10" value="2"><br><br>

            <label for="date">Date:</label><br>
            <input type="date" id="date" name="date"><br><br>

            <label for="time">Time:</label><br>
            <input type="time" id="time" name="time"><br><br>

            <input type="submit" value="Book Now">
            <input type="reset" value="Reset">
        </form>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Swadeshi Cafe. All Rights Reserved.</p>
    </footer>

</body>

</html>
