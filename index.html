<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swadeshi Cafe - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background-color: #fdf6ec;
            color: #3e2723;
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: #4e342e;
            color: #ffffff;
            text-align: center;
            padding: 30px 20px 20px;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        nav a {
            color: #f5deb3;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin: 0 6px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        hr {
            border: none;
            border-top: 2px solid #d7ccc8;
            margin: 0;
        }

        /* Main content */
        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        main h2 {
            font-size: 26px;
            color: #4e342e;
            margin-bottom: 12px;
        }

        main>p {
            font-size: 16px;
            color: #5d4037;
            margin-bottom: 24px;
        }

        main img {
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 24px;
        }

        main h3 {
            font-size: 20px;
            color: #4e342e;
            margin-bottom: 14px;
        }

        main ul {
            list-style: none;
            display: inline-block;
            text-align: left;
        }

        main ul li {
            font-size: 15px;
            color: #5d4037;
            padding: 8px 0 8px 28px;
            position: relative;
        }

        main ul li::before {
            content: "☕";
            position: absolute;
            left: 0;
            font-size: 14px;
        }

        /* Footer */
        footer {
            background-color: #4e342e;
            color: #f5deb3;
            text-align: center;
            padding: 18px;
            font-size: 13px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <!-- Header & Navigation -->
    <header>
        <h1>☕ The Swadeshi Cafe</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="menu.html">Menu</a> |
            <a href="contact.html">Book a Table</a>
        </nav>
    </header>

    <hr>

    <!-- Main Content -->
    <main>
        <h2>Welcome to Our Cafe!</h2>
        <p>We serve fresh coffee, delicious snacks, and a peaceful environment.</p>

        <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=500" alt="Cafe Image" width="400">

        <h3>Why Choose Us?</h3>
        <ul>
            <li>100% Original Coffee Beans</li>
            <li>Freshly Baked Snacks</li>
            <li>Free High-Speed Wi-Fi</li>
        </ul>
    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 The Swadeshi Cafe. All Rights Reserved.</p>
    </footer>

</body>

</html>
